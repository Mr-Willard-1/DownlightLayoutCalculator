plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ashley.downlightcalculator'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ashley.downlightcalculator'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }

    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
}
